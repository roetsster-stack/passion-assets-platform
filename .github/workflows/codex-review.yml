name: Codex review

# The checker. A different model family reads every pull request cold, against AGENTS.md, and posts
# its findings as a comment. Needs one repository secret: OPENAI_API_KEY (pay-per-use; a few cents a
# review). Without the secret the job explains itself and skips, so CI is never red for a missing key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex reads the PR
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      review: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Is the key there?
        id: key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::OPENAI_API_KEY is not set in this repository's secrets; the Codex review is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write the diff against the base branch
        if: steps.key.outputs.present == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-color "$BASE" "$HEAD" > pr.diff
          wc -l pr.diff

      - name: Codex review
        id: codex
        if: steps.key.outputs.present == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/review-prompt.md
          sandbox: read-only
          safety-strategy: read-only
          output-file: codex-review.md

  post:
    name: Post the review
    needs: review
    if: needs.review.outputs.review != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.review.outputs.review }}
        with:
          script: |
            const body = `## Codex review\n\n${process.env.REVIEW}\n\n_Independent checker · different model family · brief: AGENTS.md_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
